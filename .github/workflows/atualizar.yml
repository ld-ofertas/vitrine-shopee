name: Atualizar Vitrine Shopee

on:
  schedule:
    # Roda a cada 6 horas (00:00, 06:00, 12:00 e 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permite disparar manualmente a qualquer momento

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar bibliotecas necessárias
        run: pip install requests

      - name: Executar script Python
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
        run: python gerar_vitrine.py

      - name: Salvar e publicar alterações no GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: atualiza vitrine da shopee" && git push)
